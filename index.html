    /* Gradiente sutil e customização */
    .gradient-bg {

    }
    .hero-wave {
      position: relative;
      overflow: hidden;
    }
    .hero-wave:after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: repeating-linear-gradient(45deg, #fff5ef 0px, #fff5ef 20px, #fdece3 20px, #fdece3 40px);
      opacity: 0.5;
      pointer-events: none;
    }
    @media (max-width: 640px) {
      .hero-wave:after {
        height: 30px;
      }
    }
  </style>
