<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lead Beauty</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <style>
    .hidden { display: none; }
  </style>
</head>

<body class="bg-white text-black">

<!-- HOME -->
<section id="home">
  <div class="p-6">
    <h1 class="text-3xl font-bold mb-2">Lead Beauty</h1>
    <p class="text-gray-600">Conectando clientes e profissionais da estética</p>
  </div>

  <div class="p-6 space-y-3">
    <button onclick="showView('cliente')" class="bg-black text-white px-4 py-3 w-full rounded">
      Buscar Atendimento
    </button>

    <button onclick="showView('login')" class="bg-gray-800 text-white px-4 py-3 w-full rounded">
      Área Profissional
    </button>
  </div>
</section>

<!-- CLIENTE -->
<section id="cliente" class="hidden p-6">
  <h2 class="text-xl font-bold mb-4">Cadastro do Cliente</h2>

  <form id="formCliente" onsubmit="handleCliente(event)">
    <input id="cli_nome" placeholder="Nome" class="border p-2 w-full mb-2 rounded" required />
    <input id="cli_whatsapp" placeholder="WhatsApp" class="border p-2 w-full mb-2 rounded" required />
    <input id="cli_email" placeholder="Email" class="border p-2 w-full mb-2 rounded" required />
    <input id="cli_cidade" placeholder="Cidade" class="border p-2 w-full mb-2 rounded" required />

    <select id="cli_tratamento" class="border p-2 w-full mb-4 rounded">
      <option>Estrias</option>
      <option>Cicatrizes</option>
      <option>Olheiras</option>
      <option>Microagulhamento</option>
    </select>

    <button class="bg-black text-white px-4 py-3 w-full rounded">
      Enviar
    </button>
  </form>

  <button onclick="showView('home')" class="mt-3 border p-2 w-full rounded">
    Voltar
  </button>
</section>

<!-- LOGIN -->
<section id="login" class="hidden p-6">
  <h2 class="text-xl font-bold mb-4">Login Profissional</h2>

  <form onsubmit="loginProf(event)">
    <input id="login_email" placeholder="Email" class="border p-2 w-full mb-2 rounded" required />
    <input id="login_senha" type="password" placeholder="Senha" class="border p-2 w-full mb-4 rounded" required />

    <button class="bg-black text-white px-4 py-3 w-full rounded">
      Entrar
    </button>
  </form>

  <button onclick="showView('home')" class="mt-3 border p-2 w-full rounded">
    Voltar
  </button>
</section>

<script>
  // 🔥 FIREBASE CONFIG
  const firebaseConfig = {
    apiKey: "AIzaSyDX_vxiittvMdKEF5_p-rwCK_IkUIFs05o",
    authDomain: "lead-beauty.firebaseapp.com",
    projectId: "lead-beauty",
    storageBucket: "lead-beauty.firebasestorage.app",
    messagingSenderId: "348290705731",
    appId: "1:348290705731:web:a4393a867938a842f727f6"
  };

  firebase.initializeApp(firebaseConfig);

  const auth = firebase.auth();
  const db = firebase.firestore();

  // 🔁 NAVEGAÇÃO
  function showView(view) {
    ["home", "cliente", "login"].forEach(id => {
      document.getElementById(id).classList.add("hidden");
    });

    document.getElementById(view).classList.remove("hidden");
  }

  // 📩 CADASTRO CLIENTE
  function handleCliente(e) {
    e.preventDefault();

    const lead = {
      nome: cli_nome.value.trim(),
      whatsapp: cli_whatsapp.value.trim(),
      email: cli_email.value.trim(),
      cidade: cli_cidade.value.trim(),
      tratamento: cli_tratamento.value,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    db.collection("clientes").add(lead)
      .then(() => {
        alert("Cadastro enviado com sucesso!");
        document.getElementById("formCliente").reset();
        showView("home");
      })
      .catch(err => {
        alert("Erro ao enviar: " + err.message);
      });
  }

  // 🔐 LOGIN PROFISSIONAL
  function loginProf(e) {
    e.preventDefault();

    auth.signInWithEmailAndPassword(
      login_email.value,
      login_senha.value
    )
    .then(() => {
      alert("Login realizado com sucesso!");
      showView("home");
    })
    .catch(err => {
      alert("Erro: " + err.message);
    });
  }

  // 👤 STATUS LOGIN
  auth.onAuthStateChanged(user => {
    console.log(user ? "Usuário logado" : "Usuário deslogado");
  });

  // 🏠 INICIAL
  showView("home");
</script>

</body>
</html>
