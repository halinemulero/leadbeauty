<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haline Lead Beauty - Solicitação Especialista</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --cor-fundo: #FBF9F6;       /* Off-white ultra clean e sofisticado */
      --cor-card: #FFFFFF;        /* Branco puro para o bloco central */
      --cor-dourado: #C5A059;     /* O Dourado marcante da sua marca */
      --cor-dourado-hover: #AE8C47;
      --cor-texto-principal: #3D3530; /* Marrom escuro luxuoso (substitui o preto bruto) */
      --cor-texto-mutado: #7A726E;
      --cor-borda: #EAE3DC;
    }

    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background-color: var(--cor-fundo);
      color: var(--cor-texto-principal);
      text-align: center;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    /* Detalhe sutil de fundo abstrato para dar textura de SPA/Clínica de Luxo */
    body::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(197, 160, 89, 0.08) 0%, transparent 70%);
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: auto;
      position: relative;
      z-index: 1;
    }

    header {
      margin-bottom: 25px;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      color: var(--cor-dourado);
      font-size: 36px;
      font-weight: 600;
      margin: 0 0 5px 0;
      letter-spacing: 0.5px;
    }

    .tagline {
      color: var(--cor-texto-mutado);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* Card Clean Luxuoso */
    .card {
      background: var(--cor-card);
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(140, 122, 107, 0.1);
      box-sizing: border-box;
      border: 1px solid var(--cor-borda);
      text-align: left;
    }

    .instrucao {
      font-size: 14px;
      line-height: 1.6;
      color: var(--cor-texto-mutado);
      text-align: center;
      margin-bottom: 30px;
    }

    /* Labels elegantes em Dourado */
    label {
      display: block;
      font-size: 12px;
      color: var(--cor-dourado);
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    /* Campos de Entrada Minimalistas */
    .campo {
      width: 100%;
      padding: 14px;
      background: #FCFAF7;
      border: 1px solid var(--cor-borda);
      border-radius: 12px;
      color: var(--cor-texto-principal);
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      margin-bottom: 22px;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    .campo:focus {
      outline: none;
      border-color: var(--cor-dourado);
      background: #FFFFFF;
      box-shadow: 0 0 0 4px rgba(197, 160, 89, 0.08);
    }

    /* Caixa de Texto Personalizada (A sua nova ideia) */
    .box-aviso-personalizado {
      background: #FAF6F0;
      border: 1px dashed var(--cor-dourado);
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 25px;
    }

    .box-aviso-personalizado p {
      margin: 0;
      font-size: 12.5px;
      color: #7A6336;
      line-height: 1.6;
    }
