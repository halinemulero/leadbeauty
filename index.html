<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lead Beauty | Conexão Estética por Haline Mulero</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #FBF9F6; color: #1E1A17; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    /* Marca d'água posicionada atrás e com opacidade baixa */
    .watermark-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 400px;
      height: 400px;
      background-image: url('logo.png');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.05;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>

  <nav class="sticky top-0 bg-white/90 backdrop-blur-md border-b border-[#E2D9D0] z-50 px-6 py-4">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-4">
        <img src="logo.png" alt="Logo" class="h-24 w-24 object-contain">
        <div class="flex flex-col">
          <span class="font-serif font-bold text-3xl tracking-tight">Lead Beauty</span>
          <span class="text-sm tracking-[0.25em] text-[#C5A059] uppercase font-bold mt-1.5" style="letter-spacing: 0.3em;">BY HALINE MULERO</span>
        </div>
      </div>
    </div>
  </nav>

  <main class="relative min-h-[50vh] flex flex-col justify-center items-center py-16 px-4">
    <div class="watermark-bg watermark-wrapper"></div>
    
    <header class="text-center z-10 max-w-3xl">
      <h1 class="font-serif text-5xl font-semibold mb-6">Conectando Estética e Excelência.</h1>
      <p class="text-lg text-[#665E5A]">A plataforma idealizada por Haline Mulero para transformar a sua captação de clientes.</p>
    </header>
  </main>

  <footer class="py-8 text-center border-t border-[#E2D9D0] bg-white">
    <p class="font-serif text-lg font-bold">Lead Beauty</p>
  </footer>

</body>
</html>
