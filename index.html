<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lead Beauty | Conexão Estética</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body { font-family: 'Arial', sans-serif; }
    .btn { transition: all 0.3s ease; }
    .btn:hover { transform: scale(1.02); }
  </style>
</head>
<body class="bg-amber-50">

  <!-- Header -->
  <header class="bg-white shadow-md fixed w-full top-0 z-50">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-amber-600">✨ Lead Beauty</h1>
      <a href="#contato" class="bg-amber-600 text-white px-5 py-2 rounded-full hover:bg-amber-700 btn">Conectar</a>
    </div>
  </header>

  <!-- Hero -->
  <section class="pt-24 pb-12 text-center">
    <div class="container mx-auto px-4">
      <h2 class="text-4xl md:text-5xl font-bold text-gray-800 mb-4">Conexão Estética por <span class="text-amber-600">Haline Mulero</span></h2>
      <p class="text-xl text-gray-600 mb-8">Encontre os melhores profissionais de beleza perto de você</p>
      <img src="https://images.pexels.com/photos/3757946/pexels-photo-3757946.jpeg?auto=compress&cs=tinysrgb&w=600" class="rounded-2xl shadow-xl mx-auto max-w-md" alt="Estética">
    </div>
  </section>

  <!-- Formulário de Cadastro -->
  <section id="contato" class="py-12 bg-white">
    <div class="container mx-auto px-4 max-w-lg">
      <div class="bg-amber-50 rounded-2xl p-8 shadow-xl">
        <h3 class="text-2xl font-bold text-center mb-6">📋 Cadastre-se agora</h3>
        
        <form id="cadastroForm">
          <div class="mb-4">
            <label class="block text-gray-700 mb-2">Nome completo *</label>
            <input type="text" id="nome" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-amber-500" required>
          </div>
          
          <div class="mb-4">
            <label class="block text-gray-700 mb-2">WhatsApp *</label>
            <input type="tel" id="whatsapp" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-amber-500" required>
          </div>
          
          <div class="mb-4">
            <label class="block text-gray-700 mb-2">E-mail *</label>
            <input type="email" id="email" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-amber-500" required>
          </div>
          
          <button type="submit" class="w-full bg-amber-600 text-white font-bold py-3 rounded-lg hover:bg-amber-700 btn text-lg">
            📩 Enviar cadastro
          </button>
        </form>
        
        <div id="mensagem" class="mt-4 text-center hidden"></div>
        <p class="text-xs text-gray-500 text-center mt-4">Seus dados estão seguros</p>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-gray-800 text-white text-center py-6">
    <p>© 2025 Lead Beauty - Todos os direitos reservados</p>
    <p class="text-sm mt-2">Conexão Estética por Haline Mulero</p>
  </footer>

  <script>
    // Formulário funcionando sem Firebase!
    const form = document.getElementById('cadastroForm');
    const mensagem = document.getElementById('mensagem');
    
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      
      const nome = document.getElementById('nome').value;
      const whatsapp = document.getElementById('whatsapp').value;
      const email = document.getElementById('email').value;
      
      if(!nome || !whatsapp || !email) {
        mensagem.innerHTML = '<span class="text-red-600">⚠️ Preencha todos os campos!</span>';
        mensagem.classList.remove('hidden');
        setTimeout(() => mensagem.classList.add('hidden'), 3000);
        return;
      }
      
      // Sucesso!
      mensagem.innerHTML = '<span class="text-green-600 bg-green-100 px-4 py-2 rounded-full">✅ Cadastro enviado! Entraremos em contato em até 2 horas.</span>';
      mensagem.classList.remove('hidden');
      
      // Limpar formulário
      form.reset();
      
      // Esconder mensagem depois de 5 segundos
      setTimeout(() => mensagem.classList.add('hidden'), 5000);
      
      console.log('Lead cadastrado:', {nome, whatsapp, email});
    });
  </script>
</body>
</html>
