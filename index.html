<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro Profissional - Haline Lead Beauty</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      background-color: #FBF9F6;
      color: #3D3530;
      text-align: center;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .container { width: 100%; max-width: 500px; margin: auto; }
    h1 { font-family: 'Playfair Display', serif; color: #C5A059; font-size: 34px; margin: 0 0 5px 0; font-weight: 500; }
    .tagline { color: #A69E9A; font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 25px; }
    .card { background: #FFFFFF; padding: 20px 15px; border-radius: 24px; box-shadow: 0 15px 35px rgba(140, 122, 107, 0.1); border: 1px solid #EAE3DC; box-sizing: border-box; }
    
    /* Estilo do formulário do Google embutido */
    iframe {
      width: 100%;
      height: 600px;
      border: none;
      border-radius: 16px;
    }
    
    .link-voltar { display: block; text-align: center; margin-top: 20px; color: #A69E9A; font-size: 12px; text-decoration: none; font-weight: 500; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Haline Lead Beauty</h1>
    <div class="tagline">Credenciamento de Profissionais</div>
    
    <div class="card">
      <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScgzX3XcoVnweDoo_qIuiyYTcjik38eVaNI4nZvND3wrNSNzQ/viewform?embedded=true">Carregando...</iframe>
    </div>
    
    <a href="index.html" class="link-voltar">← Voltar para a Página Inicial</a>
  </div>
</body>
</html>
