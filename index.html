<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lead Beauty</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

<style>
body{font-family:Arial;background:#faf7f5;margin:0}
.hidden{display:none}
.container{max-width:900px;margin:auto;padding:20px}
.card{background:#fff;padding:20px;border-radius:12px;margin-top:20px}
button{cursor:pointer}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="container">
  <h1>Lead Beauty</h1>
  <p>Conectando clientes e profissionais</p>

  <button onclick="show('cliente')">Buscar Atendimento</button>
  <button onclick="show('profissional')">Área Profissional</button>
</div>

<!-- CLIENTE -->
<div id="cliente" class="container hidden">
  <div class="card">
    <h2>Solicitar Atendimento</h2>

    <input id="nome" placeholder="Nome"><br><br>
    <input id="whats" placeholder="WhatsApp"><br><br>
    <input id="email" placeholder="Email"><br><br>
    <input id="cidade" placeholder="Cidade"><br><br>

    <select id="tratamento">
      <option>Camuflagem de Estrias</option>
      <option>Camuflagem de Cicatrizes</option>
      <option>Camuflagem de Olheiras</option>
      <option>Microagulhamento</option>
      <option>Estética Facial</option>
    </select><br><br>

    <button onclick="enviarCliente()">Enviar</button>
    <button onclick="show('home')">Voltar</button>
  </div>
</div>

<!-- PROFISSIONAL -->
<div id="profissional" class="container hidden">
  <div class="card">
    <h2>Cadastro Profissional</h2>

    <input id="p_nome" placeholder="Nome"><br><br>
    <input id="p_email" placeholder="Email"><br><br>
    <input id="p_senha" placeholder="Senha" type="password"><br><br>
    <input id="p_cidade" placeholder="Cidade"><br><br>
    <input id="p_whats" placeholder="WhatsApp"><br><br>

    <button onclick="cadastroProf()">Cadastrar</button>
    <button onclick="show('home')">Voltar</button>
  </div>

  <div class="card">
    <h2>Login</h2>
    <input id="l_email" placeholder="Email"><br><br>
    <input id="l_senha" type="password" placeholder="Senha"><br><br>
    <button onclick="login()">Entrar</button>
  </div>
</div>

<script>
// FIREBASE REAL (SEUS DADOS)
const firebaseConfig = {
  apiKey: "AIzaSyDX_vxiittvMdKEF5_p-rwCK_IkUIFs05o",
  authDomain: "lead-beauty.firebaseapp.com",
  projectId: "lead-beauty",
  storageBucket: "lead-beauty.firebasestorage.app",
  messagingSenderId: "348290705731",
  appId: "1:348290705731:web:a4393a867938a842f727f6"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// NAVEGAÇÃO
function show(id){
  document.querySelectorAll('.container').forEach(e=>e.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

// CLIENTE
function enviarCliente(){
  const lead = {
    nome: nome.value,
    whatsapp: whats.value.replace(/\D/g,''),
    email: email.value,
    cidade: cidade.value,
    tratamento: tratamento.value,
    data: new Date().toISOString()
  };

  db.collection("leads").add(lead);

  const msg = encodeURIComponent(
    `Novo Lead:\n${lead.nome}\n${lead.tratamento}\n${lead.cidade}`
  );

  window.open(`https://wa.me/5513991444144?text=${msg}`);
  show('home');
}

// PROFISSIONAL
function cadastroProf(){
  auth.createUserWithEmailAndPassword(p_email.value, p_senha.value)
  .then(u=>{
    db.collection("profissionais").doc(u.user.uid).set({
      nome:p_nome.value,
      email:p_email.value,
      cidade:p_cidade.value,
      whatsapp:p_whats.value
    });
    alert("Cadastro feito!");
    show('home');
  })
  .catch(e=>alert(e.message));
}

// LOGIN
function login(){
  auth.signInWithEmailAndPassword(l_email.value, l_senha.value)
  .then(()=>alert("Logado!"))
  .catch(e=>alert(e.message));
}
</script>

</body>
</html>
