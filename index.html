<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lead Beauty | Conexão Estética por Haline Mulero</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #FBF9F6; }
    .watermark-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 400px;
      height: 400px;
      /* ESTA LINHA É A QUE IMPORTA: certifique-se que o arquivo no github se chama exatamente logo.png */
      background-image: url('logo.png');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.08;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body class="text-[#1E1A17] font-sans">

  <nav class="sticky top-0 bg-white/95 backdrop-blur-md border-b border-[#E2D9D0] z-50 px-6 py-4">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-4">
        <img src="logo.png" alt="Logo" class="h-24 w-24 object-contain">
        <div class="flex flex-col">
          <span class="font-serif font-bold text-3xl tracking-tight">Lead Beauty</span>
          <span class="text-sm tracking-[0.2em] text-[#C5A059] uppercase font-bold mt-1">By Haline Mulero</span>
        </div>
      </div>
    </div>
  </nav>

  <main class="relative min-h-[50vh] flex flex-col justify-center items-center py-20">
    <div class="watermark-bg"></div>
    <header class="text-center px-4 z-10 max-w-4xl">
      <h1 class="font-serif text-5xl font-semibold mb-6">Conectando Estética e Excelência.</h1>
      <p class="text-lg text-[#665E5A] mb-10">A plataforma idealizada por Haline Mulero.</p>
    </header>
  </main>

  <footer class="py-10 text-center border-t border-[#E2D9D0] bg-white">
    <p class="font-serif text-lg font-bold">Lead Beauty</p>
  </footer>
</body>
</html>
