<!-- Nova Seção: Ideias para o Instagram -->
    <div class="titulo-secao-extra">🗣️ Co-criação Haline Lead Beauty</div>
    
    <div class="card-clean" style="text-align: center; border-color: #CDA49E; background: #FFFBFB;">
      <h3 style="justify-content: center; color: #CDA49E;"><span>📸</span> Nosso Instagram é Seu!</h3>
      <p style="font-size: 13px; color: #7A726E; line-height: 1.6; margin-bottom: 20px;">
        Quer ver sua dúvida, dica de estética ou sugestão de tema virar um post oficial no nosso perfil? Conta para a gente o que você gostaria de assistir ou ler no nosso feed!
      </p>
      
      <textarea id="ideiaInstagram" placeholder="Digite sua ideia de postagem aqui... (Ex: Dicas para cuidar das unhas no inverno, mitos sobre estrias...)" style="width: 100%; height: 90px; border-radius: 12px; border: 1px solid #EAE3DC; padding: 12px; font-family: 'Montserrat', sans-serif; font-size: 12px; box-sizing: border-box; resize: none; margin-bottom: 15px; outline: none;"></textarea>
      
      <button onclick="enviarIdeia()" style="width: 100%; padding: 14px; background: #3D3530; color: #FFFFFF; border: none; border-radius: 14px; font-size: 12px; font-weight: 600; cursor: pointer; letter-spacing: 0.5px; text-transform: uppercase;">Enviar Ideia de Post</button>
    </div>

    <script>
      function enviarIdeia() {
        var texto = document.getElementById('ideiaInstagram').value;
        if(texto.trim() === "") {
          alert("Por favor, digite sua ideia antes de enviar! ✨");
          return;
        }
        // Substitua o número abaixo pelo seu número de WhatsApp se desejar
        var linkWhatsapp = "https://wa.me/5500000000000?text=Olá%20Haline!%20Tenho%20uma%20ideia%20de%20post%20para%20o%20Instagram:%20" + encodeURIComponent(texto);
        window.open(linkWhatsapp, '_blank');
      }
    </script>
