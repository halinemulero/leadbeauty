<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lead Beauty | Conexão Estética por Haline Mulero</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <style>
    .view-section { display: none; }
    .view-section.active { display: block; }
    body { background-color: #FBF9F6; font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body>
  <nav class="p-6 flex items-center justify-between max-w-6xl mx-auto">
    <div class="cursor-pointer" onclick="showView('home')">
      <h1 class="font-serif font-bold text-3xl">Lead Beauty</h1>
    </div>
    <div class="flex gap-4">
      <button onclick="showView('cadastro-cliente')" class="font-bold text-xs">SOU CLIENTE</button>
      <button onclick="showView('login-profissional')" class="bg-black text-white px-5 py-2 rounded-xl font-bold text-xs">ÁREA PROFISSIONAL</button>
    </div>
  </nav>

  <main id="view-home" class="view-section active p-10 text-center">
    <h2 class="font-serif text-4xl mb-6">Conexão Estética Avançada</h2>
    <button onclick="showView('cadastro-cliente')" class="bg-rose-400 text-white px-8 py-4 rounded-xl font-bold">QUERO AGENDAR</button>
    <div id="chat-container" class="mt-10 p-4 border rounded-xl max-w-md mx-auto">
      <div id="chat-box" class="h-40 overflow-y-auto mb-2 text-sm"></div>
      <button onclick="triggerBotResponse(1)" class="text-xs bg-gray-200 p-2 rounded">Como funciona?</button>
    </div>
  </main>

  <section id="view-cadastro-cliente" class="view-section p-10 max-w-lg mx-auto">
    <h2 class="text-xl font-bold mb-4">Cadastro de Cliente</h2>
    <form id="form-cliente" class="space-y-4">
      <input type="text" id="cli-nome" placeholder="Nome Completo" class="w-full border p-3 rounded-xl" required>
      <input type="tel" id="cli-whatsapp" placeholder="WhatsApp" class="w-full border p-3 rounded-xl" required>
      <input type="email" id="cli-email" placeholder="E-mail" class="w-full border p-3 rounded-xl" required>
      <input type="text" id="cli-cidade" placeholder="Cidade" class="w-full border p-3 rounded-xl">
      <select id="cli-tratamento" class="w-full border p-3 rounded-xl">
        <option>Microagulhamento de Estrias</option>
        <option>Camuflagem de Cicatrizes</option>
      </select>
      <button type="submit" class="w-full bg-black text-white py-3 rounded-xl">Cadastrar</button>
    </form>
  </section>

  <section id="view-login-profissional" class="view-section p-10 max-w-lg mx-auto">
    <h2 class="text-xl font-bold mb-4">Acesso Profissional</h2>
    <form id="form-login-prof" class="space-y-4">
      <input type="email" id="login-email" placeholder="E-mail" class="w-full border p-3 rounded-xl" required>
      <input type="password" id="login-senha" placeholder="Senha" class="w-full border p-3 rounded-xl" required>
      <button type="submit" class="w-full bg-black text-white py-3 rounded-xl">Entrar</button>
    </form>
  </section>

  <script>
    function showView(viewId) {
      document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
      document.getElementById('view-' + viewId).classList.add('active');
    }

    function triggerBotResponse(option) {
      const chatBox = document.getElementById('chat-box');
      if(option === 1) chatBox.innerHTML += '<p class="text-gray-700">A Lead Beauty conecta clientes a especialistas de forma direta.</p>';
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    document.getElementById('form-cliente').onsubmit = function(e) { e.preventDefault(); alert('Cadastro realizado!'); };
    document.getElementById('form-login-prof').onsubmit = function(e) { e.preventDefault(); alert('Acesso autorizado!'); };
  </script>
</body>
</html>
