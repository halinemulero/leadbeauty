<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lead Beauty | Haline Mulero</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Marca d'água fixa no centro */
    .bg-watermark {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 400px;
      height: 400px;
      background-image: url('logo.png');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.06;
      z-index: -1;
    }
  </style>
</head>
<body class="bg-[#FBF9F6] text-[#1E1A17] flex flex-col min-h-screen">

  <div class="bg-watermark"></div>

  <nav class="p-6 border-b border-[#E2D9D0] bg-white/50">
    <div class="max-w-5xl mx-auto flex items-center gap-6">
      <img src="logo.png" alt="Logo" class="h-20 w-20 object-contain">
      <div>
        <h1 class="text-3xl font-bold font-serif">Lead Beauty</h1>
        <p class="text-xs uppercase tracking-[0.3em] text-[#C5A059] font-bold">By Haline Mulero</p>
      </div>
    </div>
  </nav>

  <main class="flex-grow flex items-center justify-center p-6 text-center">
    <div class="max-w-2xl">
      <h2 class="text-4xl font-serif mb-4">Conectando Estética e Excelência.</h2>
      <p class="text-[#665E5A]">A plataforma idealizada por Haline Mulero para transformar a sua captação de clientes.</p>
    </div>
  </main>

  <footer class="p-8 text-center text-sm text-[#665E5A] border-t border-[#E2D9D0]">
    <p>&copy; 2026 Lead Beauty - Desenvolvido para Haline Mulero</p>
  </footer>

</body>
</html>
