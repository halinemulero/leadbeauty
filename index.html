<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lead Beauty | Plataforma de Estética Avançada e Camuflagem</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            serif: ['Playfair Display', 'serif']
          }
        }
      }
    }
  </script>

  <style>
    .hidden-section { display: none; }
  </style>
</head>

<body class="bg-white text-gray-800 font-sans">

<!-- NAV -->
<nav class="p-4 border-b">
  <div class="flex justify-between">
    <h1 class="font-bold">Lead Beauty</h1>
    <div>
      <button onclick="showView('cadastro-cliente')">Buscar</button>
      <button onclick="showView('login-profissional')">Profissional</button>
    </div>
  </div>
</nav>

<!-- HOME -->
<section id="view-home" class="view-section p-6">
  <h2 class="text-xl font-bold">Conectando clientes e profissionais</h2>
</section>

<!-- CLIENTE -->
<section id="view-cadastro-cliente" class="view-section hidden-section p-6">
  <h2>Cadastro Cliente</h2>

  <form onsubmit="handleCadastroCliente(event)">
    <input id="cli-nome" placeholder="Nome" required>
    <input id="cli-whatsapp" placeholder="WhatsApp" required>
    <input id="cli-email" placeholder="Email" required>
    <input id="cli-cidade" placeholder="Cidade" required>
    <input id="cli-estado" placeholder="UF" required>

    <select id="cli-tratamento">
      <option>Camuflagem de Estrias</option>
      <option>Camuflagem de Cicatrizes</option>
      <option>Camuflagem de Olheiras</option>
    </select>

    <button type="submit">Enviar</button>
  </form>
</section>

<!-- PROFISSIONAL -->
<section id="view-cadastro-profissional-view" class="view-section hidden-section p-6">
  <h2>Cadastro Profissional</h2>

  <form onsubmit="handleCadastroProfissional(event)">
    <input id="prof-nome" placeholder="Nome" required>
    <input id="prof-email" placeholder="Email" required>
    <input id="prof-senha" placeholder="Senha" type="password" required>
    <input id="prof-cidade" placeholder="Cidade" required>
    <input id="prof-estado" placeholder="UF" required>
    <input id="prof-whatsapp" placeholder="WhatsApp" required>

    <button type="submit">Cadastrar</button>
  </form>
</section>

<!-- LOGIN -->
<section id="view-login-profissional" class="view-section hidden-section p-6">
  <h2>Login Profissional</h2>

  <form onsubmit="handleLoginProfissional(event)">
    <input id="login-email" placeholder="Email" required>
    <input id="login-senha" type="password" placeholder="Senha" required>
    <button type="submit">Entrar</button>
  </form>
</section>

<!-- FIREBASE -->
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDX_vxiittvMdKEF5_p-rwCK_IkUIFs05o",
  authDomain: "lead-beauty.firebaseapp.com",
  projectId: "lead-beauty",
  storageBucket: "lead-beauty.appspot.com",
  messagingSenderId: "348290705731",
  appId: "1:348290705731:web:a4393a867938a842f727f6",
  measurementId: "G-S74YXWT7FY"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

// navegação
function showView(id){
  document.querySelectorAll('.view-section').forEach(v=>v.classList.add('hidden-section'));
  document.getElementById('view-'+id).classList.remove('hidden-section');
}

// CLIENTE
function handleCadastroCliente(e){
  e.preventDefault();

  const lead = {
    nome: cli-nome.value,
    whatsapp: cli-whatsapp.value,
    email: cli-email.value,
    cidade: cli-cidade.value,
    estado: cli-estado.value,
    tratamento: cli-tratamento.value
  };

  db.collection("clientes").add(lead)
    .then(()=> alert("Enviado com sucesso!"))
    .catch(()=> alert("Erro ao enviar"));
}

// PROFISSIONAL
function handleCadastroProfissional(e){
  e.preventDefault();

  const email = prof-email.value;
  const senha = prof-senha.value;

  auth.createUserWithEmailAndPassword(email, senha)
    .then(user=>{
      return db.collection("profissionais").doc(user.user.uid).set({
        nome: prof-nome.value,
        email,
        cidade: prof-cidade.value,
        estado: prof-estado.value,
        whatsapp: prof-whatsapp.value
      });
    })
    .then(()=> alert("Profissional cadastrado!"))
    .catch(err=> alert(err.message));
}

// LOGIN
function handleLoginProfissional(e){
  e.preventDefault();

  auth.signInWithEmailAndPassword(login-email.value, login-senha.value)
    .then(()=> alert("Login OK"))
    .catch(err=> alert(err.message));
}
</script>

</body>
</html>
