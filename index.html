<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDX_vxiittvMdKEF5_p-rwCK_IkUIFs05o",
    authDomain: "lead-beauty.firebaseapp.com",
    projectId: "lead-beauty",
    storageBucket: "lead-beauty.firebasestorage.app",
    messagingSenderId: "348290705731",
    appId: "1:348290705731:web:a4393a867938a842f727f6"
  };

  firebase.initializeApp(firebaseConfig);

  const db = firebase.firestore();
  const auth = firebase.auth();

  // NAVIGAÇÃO
  function showView(id) {
    document.querySelectorAll('main, section').forEach(el => {
      el.classList.add('hidden-section');
    });
    document.getElementById('view-' + id).classList.remove('hidden-section');
  }

  // CLIENTE
  function handleCadastroCliente(e) {
    e.preventDefault();

    const lead = {
      nome: document.getElementById('cli-nome').value,
      whatsapp: document.getElementById('cli-whatsapp').value,
      email: document.getElementById('cli-email').value,
      cidade: document.getElementById('cli-cidade').value,
      tratamento: document.getElementById('cli-tratamento').value,
      data: new Date().toLocaleString()
    };

    db.collection("clientes").add(lead)
      .then(() => {
        alert("Enviado com sucesso!");
        showView('home');
      })
      .catch(err => alert("Erro: " + err.message));
  }

  // LOGIN
  function handleLoginProfissional(e) {
    e.preventDefault();

    const email = document.getElementById('login-email').value;
    const senha = document.getElementById('login-senha').value;

    auth.signInWithEmailAndPassword(email, senha)
      .then(() => {
        alert("Login realizado com sucesso!");
        showView('home');
      })
      .catch(err => alert("Erro: " + err.message));
  }
</script>
