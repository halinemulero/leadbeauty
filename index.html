<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lead Beauty | Conexão Estética por Haline Mulero</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans'], serif: ['Playfair Display'] } } } }
  </script>
  <style>
    .watermark-bg {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 650px; height: 650px; background-image: url('logo.png');
      background-size: contain; background-position: center; background-repeat: no-repeat;
      opacity: 0.06; pointer-events: none; z-index: 0;
    }
    .view-section { display: block; }
    .hidden-section { display: none !important; }
  </style>
</head>
<body class="bg-[#FBF9F6] text-[#1E1A17]">

  <nav class="sticky top-0 bg-white/95 backdrop-blur-md border-b border-[#E2D9D0] z-50 px-6 py-4">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-4 cursor-pointer" onclick="showView('home')">
        <img src="logo.png" alt="Logo" class="h-24 w-24 object-contain">
        <div class="flex flex-col">
          <span class="font-serif font-bold text-3xl leading-none">Lead Beauty</span>
          <span class="text-[12px] tracking-[0.4em] text-[#C5A059] uppercase font-bold mt-2">BY HALINE MULERO</span>
        </div>
      </div>
      <button onclick="showView('login-profissional')" class="bg-[#1E1A17] text-white px-6 py-3 rounded-xl text-xs font-bold uppercase">Área Profissional</button>
    </div>
  </nav>
