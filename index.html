<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lead Beauty</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <style>
    .hidden { display: none; }
  </style>
</head>

<body class="bg-gray-50">

<!-- HOME -->
<section id="home">
  <div class="text-center p-10">
    <h1 class="text-3xl font-bold">Lead Beauty</h1>
    <p class="mt-2">Conectando clientes e profissionais</p>

    <button onclick="show('cliente')" class="mt-5 bg-black text-white px-4 py-2 rounded">
      Buscar Atendimento
    </button>

    <button onclick="show('login')" class="mt-2 bg-gray-700 text-white px-4 py-2 rounded">
      Área Profissional
    </button>
  </div>
</section>

<!-- CLIENTE -->
<section id="cliente" class="hidden p-6">
  <h2 class="text-xl font-bold mb-4">Cadastro Cliente</h2>

  <input id="nome" placeholder="Nome" class="border p-2 w-full mb-2">
  <input id="whatsapp" placeholder="WhatsApp" class="border p-2 w-full mb-2">
  <input id="email" placeholder="Email" class="border p-2 w-full mb-2">
  <input id="cidade" placeholder="Cidade" class="border p-2 w-full mb-2">

  <select id="tratamento" class="border p-2 w-full mb-2">
    <option>Camuflagem de Estrias</option>
    <option>Camuflagem de Cicatrizes</option>
    <option>Camuflagem de Olheiras</option>
    <option>Microagulhamento</option>
    <option>Estética Facial</option>
  </select>

  <button onclick="salvarCliente()" class="bg-black text-white w-full py-2">
    Enviar
  </button>

  <button onclick="show('home')" class="mt-2 border w-full py-2">
    Voltar
  </button>
</section>

<!-- LOGIN -->
<section id="login" class="hidden p-6">
  <h2 class="text-xl font-bold mb-4">Login Profissional</h2>

  <input id="emailLogin" placeholder="Email" class="border p-2 w-full mb-2">
  <input id="senhaLogin" type="password" placeholder="Senha" class="border p-2 w-full mb-2">

  <button onclick="login()" class="bg-black text-white w-full py-2">
    Entrar
  </button>

  <button onclick="show('home')" class="mt-2 border w-full py-2">
    Voltar
  </button>
</section>

<script>
  // FIREBASE
  const firebaseConfig = {
    apiKey: "AIzaSyDX_vxiittvMdKEF5_p-rwCK_IkUIFs05o",
    authDomain: "lead-beauty.firebaseapp.com",
    projectId: "lead-beauty",
    storageBucket: "lead-beauty.firebasestorage.app",
    messagingSenderId: "348290705731",
    appId: "1:348290705731:web:a4393a867938a842f727f6"
  };

  firebase.initializeApp(firebaseConfig);

  const db = firebase.firestore();
  const auth = firebase.auth();

  function show(tela) {
    document.querySelectorAll("section").forEach(s => s.classList.add("hidden"));
    document.getElementById(tela).classList.remove("hidden");
  }

  function salvarCliente() {
    const lead = {
      nome: nome.value,
      whatsapp: whatsapp.value,
      email: email.value,
      cidade: cidade.value,
      tratamento: tratamento.value,
      data: new Date().toLocaleString()
    };

    db.collection("clientes").add(lead)
      .then(() => {
        alert("Enviado com sucesso!");
        show("home");
      })
      .catch(err => alert(err.message));
  }

  function login() {
    auth.signInWithEmailAndPassword(
      emailLogin.value,
      senhaLogin.value
    )
    .then(() => {
      alert("Login realizado!");
      show("home");
    })
    .catch(err => alert(err.message));
  }
</script>

</body>
</html>
